<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library — Loomling</title>
  <link rel="icon" type="image/svg+xml" href="loomling-lettermark.svg">
  <script>(function(){try{var t=localStorage.getItem("loomling:theme:v1");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}}())</script>
  <script>(function(){try{if(localStorage.getItem("loomling:sidebar:collapsed:v1")==="true")document.documentElement.setAttribute("data-sidebar-collapsed","true");}catch(e){}}())</script>
  <link rel="stylesheet" href="library.css">
  <!-- The Library chrome itself only needs library.css's --lib-* tokens, but
       the SPA router (loom-router.js) swaps only <main> and keeps this head
       across navigations. Every routable page must therefore link the same
       base stylesheets here, or a page-specific sheet (e.g. src/tokens.css,
       which the System page's color tiles read) goes missing when the user
       arrives via SPA nav rather than a hard load. -->
  <link rel="stylesheet" href="../src/tokens.css">
  <link rel="stylesheet"
        href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css"
        integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7"
        crossorigin="anonymous">
</head>
<body data-page="library">
  <header class="lib-header">
    <div class="lib-header__inner">
      <a class="lib-brand" href="index.html" aria-label="Loomling Loom home">
        <img class="lib-brand__user-logo" alt="" hidden>
        <span class="lib-brand__sep" aria-hidden="true" hidden>|</span>
        <span class="lib-brand__mark" aria-hidden="true"></span>
        <span class="lib-brand__project" data-project-name>—</span>
      </a>
      <nav class="lib-tabs" aria-label="Loom views">
        <a class="lib-tab is-active" href="index.html">Library</a>
        <a class="lib-tab" href="tokens.html">System</a>
        <a class="lib-tab" href="components.html">Components</a>
        <a class="lib-tab" href="builder.html">Builder</a>
        <a class="lib-tab" href="settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <main class="lib-main" id="main-content">
    <h1 class="sr-only">Library</h1>
    <aside class="lib-side" aria-label="Sections">
      <button
        class="lib-side__collapse"
        id="lib-side-collapse"
        type="button"
        aria-pressed="false"
        data-tooltip="Collapse sidebar">
        <i class="ph ph-sidebar-simple" aria-hidden="true"></i>
        <span class="sr-only">Collapse sidebar</span>
      </button>
      <button
        class="lib-side__toggle"
        id="lib-side-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="lib-side-nav">
        <span class="lib-side__toggle-label" id="lib-side-toggle-label">Sections</span>
        <span class="lib-side__toggle-caret" aria-hidden="true">▾</span>
      </button>
      <nav class="lib-side__nav" id="lib-side-nav"></nav>
    </aside>

    <section class="lib-content" id="lib-content">
      <div class="lib-empty" hidden id="lib-empty">
        <h2 class="lib-empty__title">Nothing here yet</h2>
        <p class="lib-empty__body">
          As Claude Code builds Elements, they appear here.
          Ask CC to build something — try <code>Build a Button component with primary, secondary, and disabled states.</code>
        </p>
      </div>
    </section>
  </main>

  <script src="theme.js" defer></script>
  <script src="brand.js" defer></script>
  <script src="dev-tokens.js" defer></script>
  <script src="library.js" defer></script>
  <script src="tokens.js" defer></script>
  <script src="primitives.js" defer></script>
  <script src="settings.js" defer></script>
  <script src="builder.js" defer></script>
  <script src="sidebar-collapse.js" defer></script>
  <script src="loom-router.js" defer></script>
  <script src="onboarding.js" defer></script>
</body>
</html>
