<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home — preview</title>
  <!-- Warm the Google Fonts origins so the serialized @import chain in fonts.css
       (tokens.css → fonts.css → googleapis → gstatic .woff2) starts its TLS handshake
       in parallel with CSS download instead of after it. Preview-only — the Next port
       self-hosts via next/font and drops this whole chain. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../../src/tokens.css">
  <link rel="stylesheet" href="home.css">
  <script src="../../loader.js" defer></script>
  <!-- GSAP (opt-in, vendored — ADR 0028). Loaded sync so window.gsap is ready
       by the time the async template fetch resolves. home.js (entrance +
       takeover) loads right after, exposing window.HomeTemplate.init(root). -->
  <script src="../../vendor/gsap.min.js"></script>
  <script src="home.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: var(--background); color: var(--text1); font-family: var(--font-body); }
  </style>
</head>
<body>
  <div id="preview-frame"></div>
  <script>
    // Fetch the canonical template markup so home.html stays the single
    // source of truth while we iterate piece by piece. State + slot wiring
    // arrive in later pieces; for now ?state= is read but only "default"
    // (the resting layout) exists.
    (function () {
      const params = new URLSearchParams(location.search);
      const state = params.get("state") || "default"; // reserved for later pieces
      fetch("home.html")
        .then((r) => r.text())
        .then((html) => {
          const frame = document.getElementById("preview-frame");
          frame.innerHTML = html;
          const root = frame.querySelector('[data-loom-template="home"]');
          if (root) {
            root.setAttribute("data-preview-state", state);
            // Full-viewport (100svh) only when standalone (direct URL / real
            // page). Inside the Loom Sandbox iframe (self !== top) the iframe
            // auto-sizes to content, so 100svh would loop — size to content.
            if (window.self === window.top) root.classList.add("home--standalone");
            // Entrance + takeover wiring live in home.js (window.HomeTemplate).
            // Init also mounts the interactive grid bg + binds it to the home's
            // open/close state (reduced-motion: skipped, original ::before
            // paper-wash remains visible).
            if (window.HomeTemplate) window.HomeTemplate.init(root);
          }
          try { parent.postMessage({ type: "loom:ready", slug: "home" }, location.origin); } catch (_) {}
        });
    })();
  </script>
</body>
</html>
