<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Date Picker — preview</title><link rel="stylesheet" href="../../../src/tokens.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2/src/regular/style.css"><link rel="stylesheet" href="date-picker.css"><script src="date-picker.js" defer></script><style>html, body { margin: 0; padding: 0; background: var(--background); color: var(--text1); font-family: var(--font-body); } .preview-frame { display: flex; align-items: center; justify-content: center; padding: var(--space-5); }</style></head>
<body>
  <div class="preview-frame">
    <div data-loom="date-picker" role="application" aria-label="Calendar">
      <div class="dp-head"><i class="ph ph-caret-left"></i><span class="dp-title">May 2026</span><i class="ph ph-caret-right"></i></div>
      <div class="dp-week"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
      <div class="dp-grid">
        <span class="dp-day dp-day--muted">27</span><span class="dp-day dp-day--muted">28</span><span class="dp-day dp-day--muted">29</span><span class="dp-day dp-day--muted">30</span><span class="dp-day">1</span><span class="dp-day">2</span><span class="dp-day">3</span>
        <span class="dp-day">4</span><span class="dp-day">5</span><span class="dp-day">6</span><span class="dp-day">7</span><span class="dp-day">8</span><span class="dp-day">9</span><span class="dp-day">10</span>
        <span class="dp-day">11</span><span class="dp-day">12</span><span class="dp-day">13</span><span class="dp-day">14</span><span class="dp-day">15</span><span class="dp-day">16</span><span class="dp-day">17</span>
        <span class="dp-day">18</span><span class="dp-day">19</span><span class="dp-day dp-day--today">20</span><span class="dp-day dp-day--selected">21</span><span class="dp-day">22</span><span class="dp-day">23</span><span class="dp-day">24</span>
        <span class="dp-day">25</span><span class="dp-day">26</span><span class="dp-day">27</span><span class="dp-day">28</span><span class="dp-day">29</span><span class="dp-day">30</span><span class="dp-day">31</span>
      </div>
    </div>
  </div>
  <script>try { parent.postMessage({ type: "loom:ready", slug: "date-picker" }, "*"); } catch (_) {}</script>
</body>
</html>
