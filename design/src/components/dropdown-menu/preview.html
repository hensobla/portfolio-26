<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dropdown Menu — preview</title>
  <link rel="stylesheet" href="../../../src/tokens.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2/src/regular/style.css">
  <link rel="stylesheet" href="dropdown-menu.css"><script src="dropdown-menu.js" defer></script>
  <style>
    html, body { margin: 0; padding: 0; background: var(--background); color: var(--text1); font-family: var(--font-body); }
    .preview-frame { display: flex; align-items: center; justify-content: center; padding: var(--space-5); }
  </style>
</head>
<body>
  <div class="preview-frame" id="preview-frame">
    <div data-loom="dropdown-menu" role="menu" aria-label="Project actions">
      <button type="button" role="menuitem"><i class="ph ph-arrow-square-out" aria-hidden="true"></i><span>Open in new tab</span><kbd>⌘O</kbd></button>
      <button type="button" role="menuitem" data-state="hover"><i class="ph ph-link" aria-hidden="true"></i><span>Copy link</span><kbd>⌘L</kbd></button>
      <button type="button" role="menuitem"><i class="ph ph-download-simple" aria-hidden="true"></i><span>Download</span></button>
      <hr aria-hidden="true">
      <button type="button" role="menuitem" data-tone="destructive"><i class="ph ph-trash" aria-hidden="true"></i><span>Delete</span></button>
    </div>
  </div>
  <script>
    try { parent.postMessage({ type: "loom:ready", slug: "dropdown-menu" }, "*"); } catch (_) {}
  </script>
</body>
</html>
