<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icon Button — preview</title>
  <link rel="stylesheet" href="../../../src/tokens.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2/src/regular/style.css">
  <link rel="stylesheet" href="icon-button.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--background); color: var(--text1); font-family: var(--font-body); }
    .preview-frame { display: flex; align-items: center; justify-content: center; padding: var(--space-5); }
  </style>
</head>
<body>
  <div class="preview-frame" id="preview-frame"></div>
  <script>
    (function () {
      const STATES = {
        default:  { variant: null,      state: null       },
        hover:    { variant: null,      state: "hover"    },
        focused:  { variant: null,      state: "focused"  },
        disabled: { variant: null,      state: "disabled" },
        primary:  { variant: "primary", state: null       }
      };
      const params = new URLSearchParams(location.search);
      const stateId = params.get("state") || "default";
      const baseState = STATES[stateId] || STATES.default;
      function render() {
        const stateAttr = baseState.state ? ` data-state="${baseState.state}"` : "";
        const variantAttr = baseState.variant ? ` data-variant="${baseState.variant}"` : "";
        document.getElementById("preview-frame").innerHTML =
          `<button type="button" data-loom="icon-button"${variantAttr}${stateAttr} aria-label="Notifications">` +
            `<i class="ph ph-bell" aria-hidden="true"></i>` +
          `</button>`;
      }
      render();
      try { parent.postMessage({ type: "loom:ready", slug: "icon-button" }, "*"); } catch (_) {}
    })();
  </script>
</body>
</html>
