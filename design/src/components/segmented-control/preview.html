<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Segmented Control — preview</title>
  <link rel="stylesheet" href="../../../src/tokens.css">
  <link rel="stylesheet" href="segmented-control.css"><script src="segmented-control.js" defer></script>
  <style>
    html, body { margin: 0; padding: 0; background: var(--background); color: var(--text1); font-family: var(--font-body); }
    .preview-frame { display: flex; align-items: center; justify-content: center; padding: var(--space-5); }
  </style>
</head>
<body>
  <div class="preview-frame" id="preview-frame">
    <div data-loom="segmented-control" role="tablist" aria-label="View mode">
      <button type="button" role="tab" aria-selected="true">All</button>
      <button type="button" role="tab" aria-selected="false">Active</button>
      <button type="button" role="tab" aria-selected="false">Archived</button>
    </div>
  </div>
  <script>
    try { parent.postMessage({ type: "loom:ready", slug: "segmented-control" }, "*"); } catch (_) {}
  </script>
</body>
</html>
